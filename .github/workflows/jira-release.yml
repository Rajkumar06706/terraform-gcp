name: Jira Release

on:
  repository_dispatch:
    types:
      - jira-release

jobs:
  release:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Version
        run: |
          echo "Version = ${{ github.event.client_payload.fixVersion }}"

      - name: Create Git Tag
        run: |
          VERSION=${{ github.event.client_payload.fixVersion }}

          git config user.name "release-bot"
          git config user.email "release-bot@company.com"

          git tag $VERSION
          git push origin $VERSION

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.client_payload.fixVersion }}
