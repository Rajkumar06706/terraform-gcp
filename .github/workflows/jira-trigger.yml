name: Jira Trigger

on:
  repository_dispatch:
    types:
      - jira-release-approved

permissions:
  contents: write

jobs:

  release:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Create Release Tag
        run: |
          git config user.name "jira-github-broker"
          git config user.email "jira-github-broker@users.noreply.github.com"
      
          TAG="v${{ github.event.client_payload.release_version }}"
      
          git fetch --tags
      
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists"
            exit 1
          fi
      
          echo "Creating tag ${TAG}"
      
          git tag "${TAG}"
          git push origin "${TAG}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ github.event.client_payload.release_version }}"

          echo "Creating GitHub Release ${TAG}"

          gh release create "${TAG}" \
            --title "Release ${TAG}" \
            --generate-notes
